<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>影视前期提示词生成器</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/vendor/tom-select/tom-select.css">
<link rel="stylesheet" href="assets/theme-mecha.css">
  <link rel="stylesheet" href="assets/theme-blackboard.css">
  <link rel="stylesheet" href="assets/theme-cyber.css">
  <link rel="stylesheet" href="assets/theme-guofeng.css">
</head>
<body>
<div id="bg3d"></div>
<div id="app">
  <!-- 右上角工具组（固定，跨主题一致）：规范 + 设置 -->
  <div id="topTools">
    <button id="btnSpec" class="icon-btn" title="创作规范">⚖️<span class="tb-lab">规范</span></button>
    <button id="btnSettings" class="icon-btn" title="设置">⚙️</button>
  </div>

  <!-- 创作规范弹层（点击 ⚖️ 展开，仅作用于写小说环节） -->
  <div id="specPanel" class="spec-panel hidden">
    <div class="spec-head">
      <span>📐 创作规范</span>
      <span class="spec-note">仅作用于「写小说」</span>
    </div>
    <div class="spec-list" id="specList"></div>
  </div>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎬</span>
      <span class="title">影视前期提示词生成器</span>
    </div>
  </header>

  <!-- 步骤指示 -->
  <nav id="stepper" class="stepper"></nav>

  <!-- 机甲主题专用顶部胶囊导航 -->
  <nav id="mechaTopNav" class="mecha-top-nav">
    <button class="cap" data-step="1">故事构想</button>
    <button class="cap" data-step="2">角色提示词</button>
    <button class="cap" data-step="3">场景提示词</button>
    <button class="cap" data-step="4">分镜文字</button>
    <button class="cap" data-export>导出资产包</button>
  </nav>

  <!-- 主内容 -->
  <main id="view" class="view"></main>

  <!-- 页面末尾：小说内容总字数（固定浮于底部导航之上） -->
  <div id="wcTotal" class="wc-total hidden"></div>

  <!-- 底部导航 -->
  <nav class="tabbar">
    <button class="tab" data-step="1"><span>📖</span>故事</button>
    <button class="tab" data-step="2"><span>🧑</span>角色</button>
    <button class="tab" data-step="3"><span>🏞️</span>场景</button>
    <button class="tab" data-step="4"><span>🎞️</span>分镜</button>
    <button class="tab" data-step="5"><span>📦</span>导出</button>
  </nav>

  <!-- 赛博朋克主题：底部游戏手柄底座图 -->
  <div id="cyberPad" class="cyber-pad hidden"></div>
</div>

<!-- 设置弹窗 -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-mask" data-close></div>
  <div class="modal-panel">
    <div class="modal-head">
      <h3>DeepSeek 配置</h3>
      <button class="icon-btn" data-close>✕</button>
    </div>
    <div class="modal-body">
      <label class="field">
        <span>API Key（仅存本机浏览器，不会上传任何第三方）</span>
        <input id="cfgKey" type="password" placeholder="sk-..." autocomplete="off">
      </label>
      <label class="field">
        <span>接口地址（默认官方，无需改）</span>
        <input id="cfgBase" type="text" placeholder="https://api.deepseek.com">
      </label>
      <label class="field">
        <span>模型名（官方当前提供 3 个 V4 模型）</span>
        <select id="cfgModel">
          <option value="deepseek-v4-pro" selected>deepseek-v4-pro（质量最高，推荐）</option>
          <option value="deepseek-v4-flash">deepseek-v4-flash（最快/最便宜）</option>
          <option value="deepseek-v4-flash-vision-exp">deepseek-v4-flash-vision-exp（带视觉，本工具用不上）</option>
        </select>
      </label>
      <label class="field">
        <span>温度（0.1 严谨 ~ 1.0 发散，建议 0.7）</span>
        <input id="cfgTemp" type="number" step="0.1" min="0" max="1" placeholder="0.7">
      </label>
      <p class="hint">本工具仅调用 DeepSeek 生成文字与提示词，不出图。图片请在「即梦」用提示词生成。</p>

      <div class="theme-box">
        <h4>🎨 界面主题（实时切换，无需换页）</h4>
        <div class="theme-btns">
          <button type="button" class="btn theme" data-theme="dark">🌙 默认深色</button>
          <button type="button" class="btn theme" data-theme="blackboard">🎮 3D 黑板</button>
          <button type="button" class="btn theme" data-theme="mecha">🦾 机甲科幻</button>
          <button type="button" class="btn theme" data-theme="cyber">🕹️ 赛博朋克</button>
          <button type="button" class="btn theme" data-theme="guofeng">🏮 古风国潮</button>
        </div>
        <p class="hint">选择后即时生效并保存到本机；3D 黑板为 three.js 教室背景，机甲科幻为黑金青绿工业金属风，赛博朋克为霓虹游戏手柄风，古风国潮为木质卷轴牌匾风。</p>
      </div>

      <div class="modal-actions">
        <button id="btnCfgTest" class="btn ghost">测试连接</button>
        <button id="btnCfgSave" class="btn primary">保存</button>
      </div>
      <p id="cfgStatus" class="status"></p>
    </div>
  </div>
</div>

<!-- 轻提示 -->
<div id="toast" class="toast hidden"></div>

<!-- 沉浸式章节阅读浮层：点侧边空白 / ✕ / ESC 退出 -->
<div id="readerOverlay" class="reader hidden">
  <div class="reader-backdrop" data-reader-close></div>
  <div class="reader-panel">
    <div class="reader-head">
      <div class="reader-title" id="readerTitle"></div>
      <button class="icon-btn reader-close" data-reader-close title="退出阅读">✕</button>
    </div>
    <div class="reader-body" id="readerBody"></div>
  </div>
</div>

<script src="assets/vendor/tom-select/tom-select.complete.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
